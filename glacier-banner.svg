<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 200" width="100%" height="100%">
  <defs>
    <!-- Cyber Dark Gradient -->
    <linearGradient id="cyberBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#050A15" />
      <stop offset="100%" stop-color="#0A192F" />
    </linearGradient>
    <!-- Aero Light Gradient -->
    <linearGradient id="aeroBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#E0F7FA" />
      <stop offset="100%" stop-color="#FFFFFF" />
    </linearGradient>
    <!-- Neon Cyan Glow -->
    <filter id="neonGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
    <!-- Frutiger Aero Glass Overlay -->
    <linearGradient id="glass" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="white" stop-opacity="0.4" />
      <stop offset="50%" stop-color="white" stop-opacity="0.1" />
      <stop offset="50%" stop-color="transparent" stop-opacity="0" />
      <stop offset="100%" stop-color="white" stop-opacity="0.2" />
    </linearGradient>
  </defs>

  <!-- Background Layer (Edit 'fill' to switch between url(#cyberBg) and url(#aeroBg) if you want a static version) -->
  <rect width="800" height="200" fill="url(#cyberBg)" />

  <!-- Cyber Grid -->
  <g stroke="#00F0FF" stroke-width="1" stroke-opacity="0.15">
    <line x1="0" y1="40" x2="800" y2="40" />
    <line x1="0" y1="80" x2="800" y2="80" />
    <line x1="0" y1="120" x2="800" y2="120" />
    <line x1="0" y1="160" x2="800" y2="160" />
    <line x1="200" y1="0" x2="200" y2="200" />
    <line x1="400" y1="0" x2="400" y2="200" />
    <line x1="600" y1="0" x2="600" y2="200" />
  </g>

  <!-- Frutiger Glass overlay -->
  <rect width="800" height="200" fill="url(#glass)" />

  <!-- Neon Accent Line -->
  <line x1="0" y1="198" x2="800" y2="198" stroke="#00F0FF" stroke-width="4" filter="url(#neonGlow)" />

  <!-- Main Text -->
  <text x="400" y="110" font-family="Arial, sans-serif" font-weight="bold" font-size="54" fill="#FFFFFF" text-anchor="middle" letter-spacing="4">
    @PROPERRAINY
  </text>
  
  <!-- Subtext -->
  <text x="400" y="145" font-family="monospace" font-size="16" fill="#AEE8FA" text-anchor="middle" letter-spacing="2">
    // UK POLITICS : DECODED & DEFROSTED
  </text>
</svg>
